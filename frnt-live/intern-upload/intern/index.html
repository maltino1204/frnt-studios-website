<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>FRNT · Kunden</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230a0a0a'/%3E%3Ctext x='50' y='68' font-family='Arial Black' font-weight='900' font-size='62' fill='%23c6ff3d' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f4f1ea;--ink:#0a0a0a;--soft:rgba(10,10,10,.6);--dim:rgba(10,10,10,.38);--line:rgba(10,10,10,.12);--acid:#c6ff3d;--pink:#ff3d6e}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding:clamp(24px,5vw,64px)}
.kopf{display:flex;align-items:baseline;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:clamp(28px,5vh,48px);padding-bottom:20px;border-bottom:2px solid var(--ink)}
.logo{font-family:'Arial Black',sans-serif;font-weight:900;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo i{width:8px;height:8px;background:var(--acid);border-radius:50%;display:inline-block}
.meta{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--dim)}
.suche{width:100%;max-width:420px;padding:12px 14px;border:2px solid var(--ink);border-radius:8px;background:#fff;font-size:15px;margin-bottom:24px;font-family:inherit}
.suche:focus{outline:none;box-shadow:4px 4px 0 var(--acid)}
.gruppe{font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:30px 0 10px}
.zeile{display:grid;grid-template-columns:1fr;gap:10px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.name{font-weight:600;font-size:17px}
.slug{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--dim);margin-top:3px}
.aktionen{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;text-decoration:none;color:var(--ink);
  padding:8px 13px;border:1.5px solid var(--ink);border-radius:6px;background:#fff;cursor:pointer;font-family:inherit;
  transition:background .15s,color .15s,transform .15s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn:active{transform:translateY(1px)}
.btn.haupt{background:var(--ink);color:var(--acid)}
.btn.haupt:hover{background:var(--pink);color:#fff;border-color:var(--pink)}
.btn.ok{background:var(--acid);border-color:var(--ink);color:var(--ink)}
.fuss{margin-top:40px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.8;color:var(--dim);max-width:62ch}
@media(min-width:760px){.zeile{grid-template-columns:minmax(220px,1fr) auto}}
</style>
</head>
<body>

<div class="kopf">
  <div class="logo">FRNT<i></i> <span style="font-family:-apple-system,sans-serif;font-weight:400;font-size:15px;color:var(--soft);letter-spacing:0">Kundenzentrale</span></div>
  <div class="meta" id="zaehler"></div>
</div>

<input class="suche" id="suche" type="search" placeholder="Kunde suchen …" autocomplete="off">
<div id="liste"></div>

<p class="fuss">Passwortgeschützt unter frnt-studios.de/intern/ — für Suchmaschinen gesperrt.<br>
Neuer Kunde: in intern/index.html eine Zeile in die Liste KUNDEN einfügen und auf GitHub hochladen.<br>
„Link kopieren" legt die Angebots-URL in die Zwischenablage — direkt für die Mail.</p>

<script>
// ─── HIER NEUE KUNDEN EINTRAGEN ────────────────────────────────
// [ Anzeigename, slug, Gruppe ]
const KUNDEN = [
  ['Hausärzte Oberkassel',            'hausaerzte-oberkassel',   'Praxen'],
  ['Praxis Schlösser',                'praxis-schloesser',       'Praxen'],
  ['Dr. Webler · Koloproktologie',    'webler',                  'Praxen'],
  ['Die Kinderärzte Oberkassel',      'kinderaerzte-oberkassel', 'Praxen'],
  ['Dr. Johns · Kardiologie',         'johns',                   'Praxen'],
  ['Dr. Milhorst / Preiß',            'milhorst-preiss',         'Praxen'],
  ['Kanzlei Köhler',                  'kanzlei-koehler',         'Kanzleien'],
  ['Kanzlei Wagner',                  'kanzlei-wagner',          'Kanzleien'],
];
// ───────────────────────────────────────────────────────────────

const BASE = 'https://frnt-studios.de';
const liste = document.getElementById('liste');

function render(filter){
  const f = (filter||'').toLowerCase();
  const treffer = KUNDEN.filter(k => (k[0]+' '+k[1]).toLowerCase().includes(f));
  document.getElementById('zaehler').textContent = treffer.length + ' von ' + KUNDEN.length + ' Kunden';
  const gruppen = [...new Set(treffer.map(k=>k[2]))];
  liste.innerHTML = gruppen.map(g =>
    '<p class="gruppe">'+g+'</p>' +
    treffer.filter(k=>k[2]===g).map(([name,slug]) => `
      <div class="zeile">
        <div><div class="name">${name}</div><div class="slug">/${slug}/</div></div>
        <div class="aktionen">
          <a class="btn haupt" href="${BASE}/angebot/${slug}/" target="_blank" rel="noopener">Angebot ↗</a>
          <a class="btn" href="${BASE}/demo/${slug}/" target="_blank" rel="noopener">Demo ↗</a>
          <button class="btn" data-url="${BASE}/angebot/${slug}/">Link kopieren</button>
        </div>
      </div>`).join('')
  ).join('');
}

liste.addEventListener('click', e => {
  const b = e.target.closest('button[data-url]'); if(!b) return;
  navigator.clipboard.writeText(b.dataset.url).then(() => {
    const t = b.textContent; b.textContent = 'Kopiert ✓'; b.classList.add('ok');
    setTimeout(() => { b.textContent = t; b.classList.remove('ok'); }, 1400);
  });
});
document.getElementById('suche').addEventListener('input', e => render(e.target.value));
render('');
</script>
</body>
</html>
