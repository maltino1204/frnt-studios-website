<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SOMA · Motion specimen</title><style>
@font-face{font-family:"Instrument Sans";src:url("../../assets/typography/fonts/instrument-sans-variable-latin.woff2") format("woff2");font-weight:400 700;font-stretch:75% 100%;}
@font-face{font-family:"Newsreader Display";src:url("../../assets/typography/fonts/newsreader-display-roman-latin.woff2") format("woff2");font-weight:400;}
@font-face{font-family:"Newsreader Display";font-style:italic;src:url("../../assets/typography/fonts/newsreader-display-italic-latin.woff2") format("woff2");font-weight:400;}
:root{--bone:#F3EFE8;--paper:#FBF9F5;--linen:#ECE6DC;--oat:#E3DBCF;--stone:#D8CFC3;--taupe:#A69A8D;--taupe-deep:#857A6E;
--umber:#6E6359;--umber-deep:#5E554D;--espresso:#25211F;--espresso-deep:#171412;--oxblood:#542C35;--ox200:#D5B5BC;
--shadow-raised:0 0 0 1px rgb(37 33 31/.07),0 1px 2px rgb(37 33 31/.04),0 4px 10px -4px rgb(37 33 31/.06);
--shadow-float:0 0 0 1px rgb(37 33 31/.06),0 2px 4px -1px rgb(37 33 31/.05),0 12px 24px -8px rgb(37 33 31/.10);
--shadow-overlay:0 0 0 1px rgb(37 33 31/.07),0 8px 16px -6px rgb(37 33 31/.08),0 32px 64px -20px rgb(37 33 31/.22);}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bone);color:var(--espresso);font-family:"Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-kerning:normal;font-feature-settings:"kern"}
.serif{font-family:"Newsreader Display",Georgia,serif;font-weight:400;letter-spacing:-.02em;line-height:1.02;text-wrap:balance}
.serif em,.it{font-family:"Newsreader Display",Georgia,serif;font-style:italic;letter-spacing:-.008em}
.num{font-variant-numeric:tabular-nums lining-nums}
.eyebrow{font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:12px;line-height:1.2}
.place{font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-variant-numeric:tabular-nums;font-size:12px;line-height:1.3}
.arch{border-radius:50% 50% 0 0 / calc(54.5% * var(--a,.8)) calc(54.5% * var(--a,.8)) 0 0;overflow:hidden}
.arch img,.cover{width:100%;height:100%;object-fit:cover;display:block}
.ai{font-size:11px;letter-spacing:.02em;font-weight:500;opacity:.9}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:560;letter-spacing:-.004em;white-space:nowrap}
html,body{width:auto;height:auto;overflow:auto}
:root{
  --dur-instant:100ms; --dur-fast:160ms; --dur-base:220ms; --dur-slow:320ms; --dur-arrive:480ms; --dur-calm:640ms; --dur-reveal:900ms;
  --ease-standard:cubic-bezier(.2,0,0,1); --ease-arrive:cubic-bezier(.16,1,.3,1); --ease-settle:cubic-bezier(.22,1,.36,1); --ease-exit:cubic-bezier(.4,0,1,1); --ease-calm:cubic-bezier(.4,0,.2,1);
  --stagger:90ms; --rise:16px; --rise-s:8px;}
body{padding:56px 64px;background:#F3EFE8}
h1{margin:10px 0 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:48px;margin-top:40px}
.stage{position:relative;height:520px;border-radius:24px;background:#FBF9F5;box-shadow:var(--shadow-raised);overflow:hidden;display:flex;align-items:center;justify-content:center}
.cap{margin-top:16px;font-size:14px;line-height:1.5;color:#5E554D}
.cap b{color:#25211F;font-weight:600}
/* 1 · Arch rise: the arch crop reveals bottom-up; the photo settles inside and stops */
.arch-rise{width:300px;height:375px;border-radius:50% 50% 0 0 / 43.6% 43.6% 0 0;overflow:hidden;
  animation:arch-clip var(--dur-calm) var(--ease-arrive) both, arch-lift var(--dur-calm) var(--ease-arrive) both}
.arch-rise img{width:100%;height:100%;object-fit:cover;display:block;animation:img-settle var(--dur-reveal) var(--ease-settle) both}
.place-l{position:absolute;left:calc(50% - 150px);bottom:44px;animation:fade-rise var(--dur-arrive) var(--ease-arrive) both;animation-delay:calc(var(--dur-calm) - 160ms)}
@keyframes arch-clip{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes arch-lift{from{transform:translateY(var(--rise));opacity:0}to{transform:none;opacity:1}}
@keyframes img-settle{from{transform:scale(1.04)}to{transform:none}}
@keyframes fade-rise{from{opacity:0;transform:translateY(var(--rise-s))}to{opacity:1;transform:none}}
/* 2 · The S draws on: the arch outline traces, the S contour traces inside it, then the fill arrives and the stroke leaves */
.s-draw{width:300px;height:375px;overflow:visible}
.s-draw .o-o{fill:none;stroke:#F3EFE8;stroke-width:8;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--dur-calm) var(--ease-arrive) both, fade-out var(--dur-base) var(--ease-exit) both;animation-delay:0ms, calc(var(--dur-calm) * 1.5)}
.s-draw .o-f{fill:#F3EFE8;fill-rule:evenodd;opacity:0;animation:fade-in var(--dur-base) var(--ease-standard) both;animation-delay:calc(var(--dur-calm) * 1.35)}
.s-draw .s-o{fill:none;stroke:#F3EFE8;stroke-width:10;stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--dur-calm) var(--ease-arrive) both, fade-out var(--dur-base) var(--ease-exit) both;animation-delay:calc(var(--dur-calm) * .5), calc(var(--dur-calm) * 1.5)}
.s-draw .s-f{fill:#F3EFE8;opacity:0;animation:fade-in var(--dur-base) var(--ease-standard) both;animation-delay:calc(var(--dur-calm) * 1.35)}
.s-stage{background:#542C35}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade-in{to{opacity:1}}
@keyframes fade-out{to{opacity:0}}
/* 3 · Wordmark lockup reveal: one movement for the whole mark (never letter by letter), the tagline follows */
.lock{display:flex;flex-direction:column;align-items:center;gap:30px}
.lock .wm{animation:fade-rise var(--dur-arrive) var(--ease-arrive) both}
.lock .line{width:0;height:1.5px;background:#25211F;animation:grow var(--dur-slow) var(--ease-standard) both;animation-delay:var(--dur-fast)}
.lock .tl{font-family:"Newsreader Display";font-style:italic;font-size:44px;animation:fade-rise var(--dur-arrive) var(--ease-arrive) both;animation-delay:calc(var(--dur-fast) * 2)}
@keyframes grow{to{width:40px}}
.replay{margin-top:28px;display:flex;gap:12px;align-items:center}
.replay button{height:44px;padding:0 20px;border-radius:999px;border:0;background:#25211F;color:#F3EFE8;font:560 15px "Instrument Sans";cursor:pointer}
.replay button:focus-visible{outline:2px solid #542C35;outline-offset:2px}
.replay label{font-size:14px;color:#5E554D;display:flex;gap:8px;align-items:center}
/* Reduced motion: the final frame, at once. Nothing carries meaning through motion alone. */
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important} }
html.rm *,html.rm *::before,html.rm *::after{animation-duration:1ms!important;animation-delay:0ms!important}
</style></head><body>
